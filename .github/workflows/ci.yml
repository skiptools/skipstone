name: skipstone CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

jobs:
  ci:
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
          - 'macos-26'
          - 'macos-15-intel'
          #- 'macos-latest'
          #- 'windows-latest'
        swift:
          - '6.2.3'
        android-api:
          - '28'
          #- '29'
          #- '30'

    steps:
      - name: Checkout skipstone.git
        uses: actions/checkout@v6
        with:
          # skip.git submodule needed for SkipDriveExternal
          submodules: true

      - uses: Homebrew/actions/setup-homebrew@main

      - name: "Install Host Toolchain prerequisites"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y install libcurl4-openssl-dev || (sudo apt-get update && sudo apt-get -y install libcurl4-openssl-dev)

      - run: brew install swiftly

      - run: swiftly init --skip-install --assume-yes --quiet-shell-followup

      - run: swiftly install --assume-yes --use ${{ matrix.swift }}

      - run: swiftly run swift --version

      - run: swift --version

      - run: swift build

      - run: swift test --parallel

      - run: echo "${PWD}/scripts" >> $GITHUB_PATH

      - run: which skip

      - run: skip version

      - run: skip android sdk install --version 'nightly-6.3'

      - run: skip doctor

      - run: skip checkup --native
        #if: runner.os != 'Linux'
        if: false # FIXME
        working-directory: ${{ runner.temp }}

      - name: "Create and Launch Emulator"
        if: false # TODO
        #if: runner.arch != 'ARM64'
        run: |
          skip android emulator create
          skip android emulator list
          skip android emulator launch --background

      - run: mkdir -p "${{ runner.temp }}/package-demo"

      - name: "Enable KVM group perms"
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: "AVD cache"
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.os }}-api-${{ matrix.android-api }}

      - name: "Create AVD and generate snapshot for caching"
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.android-api }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: "Test Swift Package on Android"
        if: runner.arch != 'ARM64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.android-api }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true

          working-directory: ${{ runner.temp }}/package-demo
          script: |
            swift package init --name "PackageDemo"
            # test on host OS
            swift test
            # test using xcrunner binary
            #skip android test --verbose
            # test using shared object file loaded from .apk
            skip android test --apk --verbose

            # now add a failing test to make sure it fails
            echo '@Test func shouldFail() { #expect(1+1 == 3, "Test should fail") }' >> Tests/PackageDemoTests/PackageDemoTests.swift

            swift build --build-tests
            ! swift test
            ! skip android test --apk

      # Linux plugin requires the Static Linux SDK
      - name: "Install SDK prerequisites"
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o 'swift-static-linux-sdk.tar.gz' 'https://download.swift.org/swift-${{ matrix.swift }}-release/static-sdk/swift-${{ matrix.swift }}-RELEASE/swift-${{ matrix.swift }}-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz'
          swift sdk install 'swift-static-linux-sdk.tar.gz'

      - name: "Build plugin"
        shell: bash
        run: |
          # Build plugins using the current installed version of Swift
          export USE_SWIFTLY=0
          # "macos" or "linux"
          OSNAME=$(echo $RUNNER_OS | tr '[A-Z]' '[a-z]')

          ./scripts/build_${OSNAME}_plugin.sh

          SKIP_BIN="${PWD}/.build/artifactbundle-${OSNAME}/skip.artifactbundle/bin"

          # set the PATH to include the newly-built `skip` command
          echo "${SKIP_BIN}" >> $GITHUB_PATH

          # override skip plugin to use the locally built binary
          echo "SKIP_COMMAND_OVERRIDE=${SKIP_BIN}/skip" >> $GITHUB_ENV

          # workaround fail when ANDROID_NDK_ROOT is set
          # see https://github.com/finagolfin/swift-android-sdk/issues/207
          echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV

