name: skipstone CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

jobs:
  ci:
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
          - 'macos-26'
          - 'macos-15-intel'
          #- 'macos-latest'
          #- 'windows-latest'
        swift:
          - '6.2.3'

    steps:
      - name: Checkout skipstone.git
        uses: actions/checkout@v6
        with:
          # skip.git submodule needed for SkipDriveExternal
          submodules: true

      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ matrix.swift }}

      - name: Get swift version
        run: swift --version

      - name: Check kotlinc
        run: which kotlinc

      - name: Swift Test (Debug)
        run: KOTLINC=kotlinc swift test -v -c debug --parallel

      - name: Build plugin
        shell: bash
        run: |
          # Build plugins using the current installed version of Swift
          export USE_SWIFTLY=0

          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            # install the static linux SDK for MUSL cross-compilation
            curl -fsSL -o 'swift-static-linux-sdk.tar.gz' 'https://download.swift.org/swift-${{ matrix.swift }}-release/static-sdk/swift-${{ matrix.swift }}-RELEASE/swift-${{ matrix.swift }}-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz'
            swift sdk install 'swift-static-linux-sdk.tar.gz'
          fi

          # "macos" or "linux"
          OSNAME=$(echo $RUNNER_OS | tr '[A-Z]' '[a-z]')
          ./scripts/build_${OSNAME}_plugin.sh

          # set the PATH to include the newly-built `skip` command
          echo "${PWD}/.build/artifactbundle-${OSNAME}/skip.artifactbundle/bin" >> $GITHUB_PATH

      - run: which skip

      - run: skip version

      - uses: Homebrew/actions/setup-homebrew@main

      # skip android sdk install needs swiftly
      - run: brew install swiftly

      - run: skip android sdk install --version 'nightly-6.3'

      - run: skip checkup --native

      - run: skip android emulator create

      - run: skip android emulator list

      - run: skip android emulator launch --background
        if: false # TODO


